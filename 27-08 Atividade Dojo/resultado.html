<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aba de Resultados</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
</head>
<body>
    <div class="container text-center mt-5">
        <h1 id="resultadoTexto"></h1>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const status = params.get("status");

        const elemento = document.getElementById("resultadoTexto");

        if (status === "APROVADO") {
            elemento.textContent = "APROVADO";
            elemento.className = "text-success"; // classe do Bootstrap pra cor verde
            } else if (status === "EXAME") {
                elemento.textContent = "EXAME";
                elemento.className = "text-warning"; // amarelo
            } else if (status === "REPROVADO") {
                elemento.textContent = "REPROVADO";
                elemento.className = "text-danger"; // vermelho
            } else {
                elemento.textContent = "Status inválido";
            }
    </script>
</body>
</html>
