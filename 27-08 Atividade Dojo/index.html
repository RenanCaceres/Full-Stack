<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atividade de Dojo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container text-center">
      <div class="mb-3">
        <label for="Nome" class="form-label">Nome do Aluno</label>
        <input type="text" class="form-control" id="nomeAluno" />
      </div>

      <div class="mb-3">
        <label for="nota1" class="form-label">1ª Nota</label>
        <input type="number" class="form-control" id="nota1" />
      </div>

      <div class="mb-3">
        <label for="nota2" class="form-label">2ª Nota</label>
        <input type="number" class="form-control" id="nota2" />
      </div>

      <div class="mb-3">
        <label for="nota3" class="form-label">3ª Nota</label>
        <input type="number" class="form-control" id="nota3" />
      </div>

      <div class="mb-3">
        <label for="nota4" class="form-label">4ª Nota</label>
        <input type="number" class="form-control" id="nota4" />
      </div>
    </div>

    <div class="container text-center">
      <div class="row align-items-start">
        <div class="col">
            Média: <span id="resultadoMedia"></span>
        </div>
        <button type="button" class="btn btn-primary" onclick= "registrarResultado()" >Enviar</button>
        <div class="col"></div>
      </div>
    </div>
        <script src="js/script.js"></script>
  </body>
</html>
